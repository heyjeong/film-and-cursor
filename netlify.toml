[build]
  command = "npm run build"
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"

[context.production.environment]
  NODE_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Deploy to Japan region
[[plugins]]
  package = "@netlify/plugin-git"
  [plugins.configuration]
    branch = "main"

# Region setting for Asia-Pacific (Tokyo)
# Note: Region must be set in Netlify dashboard under Site settings > Build & deploy > Build settings
